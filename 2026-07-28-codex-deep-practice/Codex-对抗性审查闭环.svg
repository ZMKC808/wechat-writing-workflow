<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e9e9e9"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d471"/>
    </marker>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#63d471" stroke-width="2" opacity=".22"/>
    </pattern>
    <style>
      .label { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill:#f4f4f4; font-size:28px; font-weight:500; }
      .small { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; fill:#bfc5c4; font-size:21px; }
      .green { fill:#63d471; }
      .line { stroke:#e9e9e9; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .gline { stroke:#63d471; stroke-width:3; fill:none; marker-end:url(#greenArrow); }
      .box { fill:#111; stroke:#e9e9e9; stroke-width:3; }
      .resident { fill:#102517; stroke:#63d471; stroke-width:3; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#111111"/>

  <text x="70" y="72" class="label" font-size="34px">Codex 的交付闭环</text>
  <text x="70" y="108" class="small">把“写完了”变成“有证据地通过了”</text>

  <circle cx="125" cy="455" r="78" class="box"/>
  <text x="125" y="465" text-anchor="middle" class="label">任务</text>

  <rect x="250" y="395" width="190" height="120" rx="28" class="box"/>
  <text x="345" y="465" text-anchor="middle" class="label">规划拆解</text>

  <rect x="505" y="365" width="220" height="180" rx="30" class="resident"/>
  <rect x="505" y="365" width="220" height="180" rx="30" fill="url(#hatch)"/>
  <text x="615" y="455" text-anchor="middle" class="label green">执行修改</text>
  <text x="615" y="492" text-anchor="middle" class="small">读代码 · 改代码 · 跑测试</text>

  <rect x="835" y="220" width="235" height="100" rx="24" class="resident"/>
  <rect x="835" y="220" width="235" height="100" rx="24" fill="url(#hatch)"/>
  <text x="952" y="280" text-anchor="middle" class="label green">代码审查</text>

  <rect x="835" y="390" width="235" height="100" rx="24" class="box"/>
  <text x="952" y="450" text-anchor="middle" class="label">浏览器验收</text>

  <rect x="835" y="560" width="235" height="100" rx="24" class="box"/>
  <text x="952" y="620" text-anchor="middle" class="label">安全审查</text>

  <rect x="1150" y="395" width="210" height="120" rx="28" class="box"/>
  <text x="1255" y="447" text-anchor="middle" class="label">综合问题</text>
  <text x="1255" y="482" text-anchor="middle" class="small">去重 · 排序 · 定范围</text>

  <path d="M203 455 H250" class="line"/>
  <path d="M440 455 H505" class="line"/>
  <path d="M725 410 L835 270" class="gline"/>
  <path d="M725 455 H835" class="line"/>
  <path d="M725 500 L835 610" class="line"/>
  <path d="M1070 270 L1150 430" class="line"/>
  <path d="M1070 440 H1150" class="line"/>
  <path d="M1070 610 L1150 480" class="line"/>

  <polygon points="1450,250 1530,330 1450,410 1370,330" class="box"/>
  <text x="1450" y="325" text-anchor="middle" class="label">通过？</text>
  <path d="M1360 455 C1400 455 1420 410 1450 410" class="line"/>

  <circle cx="1450" cy="570" r="78" class="resident"/>
  <circle cx="1450" cy="570" r="78" fill="url(#hatch)"/>
  <text x="1450" y="562" text-anchor="middle" class="label green">交付</text>
  <text x="1450" y="598" text-anchor="middle" class="small">附测试与证据</text>
  <path d="M1495 390 C1550 430 1550 500 1495 520" class="gline"/>
  <text x="1535" y="455" class="small green">通过</text>

  <path d="M1370 330 C1230 120 770 120 650 360" class="line"/>
  <text x="945" y="142" text-anchor="middle" class="small">不通过：带着证据回到执行</text>

  <rect x="90" y="730" width="28" height="28" rx="6" class="resident"/>
  <text x="135" y="753" class="small">驻留线程 / 长任务</text>
  <rect x="380" y="730" width="28" height="28" rx="6" class="box"/>
  <text x="425" y="753" class="small">一次性审查任务</text>
  <text x="90" y="820" class="small">每一步都要留下：现象、复现路径、修改范围、验证结果。</text>
</svg>
